<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">markdown-resume-micro</title>
  <desc id="desc">Banner: Markdown source on the left turning into a formatted resume page on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.6" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity="0.06" fill="#ffffff">
    <circle cx="1180" cy="40" r="140"/>
    <circle cx="80" cy="300" r="90"/>
  </g>

  <text x="72" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#f8fafc">markdown-resume-micro</text>
  <rect x="74" y="162" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Write your resume in Markdown. Print it as a PDF.</text>
  <text x="72" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">100% client-side · no tracking · no backend</text>

  <!-- Markdown source card -->
  <g transform="translate(820 64)">
    <rect width="170" height="200" rx="10" fill="#0b1220" stroke="#334155"/>
    <g font-family="Consolas, Menlo, monospace" font-size="14">
      <text x="16" y="34" fill="#60a5fa"># Jane Doe</text>
      <text x="16" y="62" fill="#a78bfa">## Experience</text>
      <text x="16" y="88" fill="#cbd5e1">- **Built** CI</text>
      <text x="16" y="112" fill="#cbd5e1">- Automated</text>
      <text x="16" y="140" fill="#a78bfa">## Skills</text>
      <text x="16" y="166" fill="#cbd5e1">- Azure, Linux</text>
    </g>
  </g>
  <!-- arrow -->
  <path d="M1004 164 h34" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M1032 154 l12 10 l-12 10" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rendered resume page -->
  <g transform="translate(1058 48)">
    <rect width="168" height="224" rx="6" fill="#f8fafc"/>
    <rect x="18" y="20" width="96" height="12" rx="2" fill="#1e3a8a"/>
    <rect x="18" y="40" width="70" height="5" rx="2" fill="#94a3b8"/>
    <rect x="18" y="62" width="70" height="7" rx="2" fill="#1e3a8a"/>
    <rect x="18" y="73" width="132" height="1.5" fill="#cbd5e1"/>
    <circle cx="22" cy="86" r="2" fill="#475569"/><rect x="30" y="83" width="110" height="5" rx="2" fill="#94a3b8"/>
    <circle cx="22" cy="99" r="2" fill="#475569"/><rect x="30" y="96" width="90" height="5" rx="2" fill="#94a3b8"/>
    <circle cx="22" cy="112" r="2" fill="#475569"/><rect x="30" y="109" width="102" height="5" rx="2" fill="#94a3b8"/>
    <rect x="18" y="132" width="50" height="7" rx="2" fill="#1e3a8a"/>
    <rect x="18" y="143" width="132" height="1.5" fill="#cbd5e1"/>
    <circle cx="22" cy="156" r="2" fill="#475569"/><rect x="30" y="153" width="80" height="5" rx="2" fill="#94a3b8"/>
    <circle cx="22" cy="169" r="2" fill="#475569"/><rect x="30" y="166" width="96" height="5" rx="2" fill="#94a3b8"/>
    <rect x="18" y="190" width="40" height="7" rx="2" fill="#1e3a8a"/>
    <rect x="18" y="201" width="132" height="1.5" fill="#cbd5e1"/>
    <text x="150" y="216" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#2563eb">PDF</text>
  </g>
</svg>
