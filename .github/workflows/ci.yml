name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Lint (syntax of every JS file, text hygiene, project invariants)
        run: npm run lint
      # Node 18 and 20 have no built-in coverage thresholds and no global WebSocket,
      # so they run the plain suite; the browser tests skip themselves there.
      - name: Tests
        if: matrix.node-version < 22
        run: npm test
      - name: Tests with coverage gate and headless-browser checks
        if: matrix.node-version >= 22
        run: npm run test:coverage
        env:
          REQUIRE_BROWSER: '1'
      - name: Build static site
        run: npm run build
